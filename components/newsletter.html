<section class="py-5 bg-light text-center">
  <div class="newsletter">
    <h3>Suscríbete a nuestro boletín</h3>
    <p>Recibe las últimas novedades y ofertas especiales en tu correo.</p>
    <form class="d-flex justify-content-center mt-3" id="newsletter-form">
      <input type="email" class="form-control w-50" id="email" placeholder="Ingresa tu correo" required>
      <button type="submit" class="btn btn-primary ms-3" id="subscribeButton">Suscribirme</button>
    </form>
  </div>
</section>

<!-- Modal de Confirmación -->
<div class="modal fade" id="subscriptionModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">¡Gracias por suscribirte!</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p id="modalMessage">Hemos recibido tu solicitud. Revisa tu correo electrónico para más detalles.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>


<!-- Bootstrap JS -->
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/app.js"></script>
