  <section class="py-5 bg-light text-center">
    <div class="newsletter">
      <h3>Suscríbete a nuestro boletín</h3>
      <p>Recibe las últimas novedades y ofertas especiales en tu correo.</p>
      <form class="d-flex justify-content-center mt-3" id="newsletter-form">
        <input type="email" class="form-control w-50" id="email" placeholder="Ingresa tu correo" required>
        <button class="btn btn-primary ms-3" id="subscribeButton" type="button">Suscribirme</button>
      </form>
    </div>
  </section>

  <!-- Modal de Confirmación -->
  <div class="modal fade" id="subscriptionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">¡Gracias por suscribirte!</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="modalMessage">Hemos recibido tu solicitud. Revisa tu correo electrónico para más detalles.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="./assets/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/app.js"></script>  

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      console.log("✅ DOM cargado correctamente");
  
      // Verificar si el botón de suscripción existe antes de asignar el evento
      const subscribeButton = document.getElementById('subscribeButton');
      const emailInput = document.getElementById('email');
      const modalElement = document.getElementById('subscriptionModal');
      const modalMessage = document.getElementById('modalMessage');
  
      if (!subscribeButton) {
        console.error("❌ ERROR: No se encontró el botón de suscripción en el DOM.");
        return;
      }
  
      if (!emailInput || !modalElement || !modalMessage) {
        console.error("❌ ERROR: Algunos elementos requeridos no están en el DOM.");
        return;
      }
  
      // Función para mostrar el modal de suscripción
      function showModal_newsletter(event) {
        console.log("🎯 EL BOTÓN SUSCRIBIRSE SE HA PULSADO");
        event.preventDefault(); // Evita la recarga de la página
  
        // Obtener el valor del correo ingresado
        const email = emailInput.value.trim();
  
        // Establecer el mensaje del modal
        if (email) {
          modalMessage.textContent = `¡Gracias por suscribirte! Hemos enviado un correo de confirmación a ${email}.`;
        } else {
          modalMessage.textContent = 'Por favor, ingresa un correo válido.';
        }
  
        // Mostrar el modal de Bootstrap
        const modal = new bootstrap.Modal(modalElement);
        modal.show();
  
        // Limpiar el campo de correo después de mostrar el modal
        emailInput.value = "";
      }
  
      // Agregar evento al botón de suscripción
      subscribeButton.addEventListener('click', showModal_newsletter);
    });
  </script>
